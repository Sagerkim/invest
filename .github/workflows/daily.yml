name: 매일 아침 수급지표 수집

on:
  schedule:
    # UTC 기준이라 한국시간(UTC+9)에서 9시간을 뺀다.
    # 22:30 UTC(일~목) = 07:30 KST(월~금)
    - cron: "30 22 * * 0-4"
  workflow_dispatch: # Actions 탭에서 버튼으로 즉시 실행 (데모용)

permissions:
  contents: write # 수집한 데이터를 저장소에 되돌려 커밋하기 위해 필요

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: FreeSIS 수집
        env:
          DEBUG: ${{ vars.DEBUG || '0' }}
        run: python fetch_kofia.py

      - name: 수집 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: 수급지표 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python notify_telegram.py
