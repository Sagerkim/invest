<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>증시 수급 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --up: #d4342b;
    --down: #1666d0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --card: #171b22;
      --text: #e8eaed;
      --muted: #9aa2ae;
      --line: #262c36;
      --up: #ff6b60;
      --down: #64a2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .updated { font-size: 13px; color: var(--muted); }
  .cards { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 620px) { .cards { grid-template-columns: repeat(3, 1fr); } }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; color: var(--muted); }
  .value { font-size: 27px; font-weight: 700; letter-spacing: -0.03em; }
  .value span { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .delta { margin-top: 6px; font-size: 14px; font-weight: 600; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted); }
  .asof { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .chart-card { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .chart-card h2 { font-size: 15px; margin: 0 0 12px; }
  .chart-box { position: relative; height: 260px; }
  .ranges { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .ranges button {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  .ranges button[aria-pressed="true"] { background: var(--text); color: var(--card); border-color: var(--text); }
  .note { margin-top: 20px; font-size: 13px; line-height: 1.7; color: var(--muted); }
  .error { padding: 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>증시 수급 대시보드</h1>
    <div class="updated" id="updated">불러오는 중…</div>
  </header>

  <div class="cards" id="cards"></div>

  <div class="chart-card">
    <h2>추이</h2>
    <div class="ranges" id="ranges">
      <button data-days="30" aria-pressed="true">1개월</button>
      <button data-days="90" aria-pressed="false">3개월</button>
      <button data-days="180" aria-pressed="false">6개월</button>
      <button data-days="9999" aria-pressed="false">전체</button>
    </div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
  </div>

  <p class="note">
    <strong>투자자예탁금</strong>은 투자자가 증권계좌에 넣어둔 대기 자금으로, 늘어나면 사려는 힘이 쌓인다는 뜻입니다.<br />
    <strong>신용융자</strong>는 돈을 빌려 주식을 산 금액으로, 늘어나면 빚을 낸 투자가 많아졌다는 뜻입니다.<br />
    <strong>CMA잔고</strong>는 단기 대기자금으로, 예탁금과 함께 시장에 들어올 준비가 된 돈의 크기를 보여줍니다.<br />
    출처: 금융투자협회 FreeSIS 한눈에 보는 자본시장 · 수치는 영업일 기준이며 하루 뒤 확정 게시됩니다.
  </p>
</div>

<script>
const METRICS = [
  { key: "deposit",     label: "투자자예탁금", color: "#2f6fed" },
  { key: "credit_loan", label: "신용융자",     color: "#e0733a" },
  { key: "cma",         label: "CMA잔고",      color: "#4a9a72" },
];

const fmt = (n) => n.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function renderCards(latest) {
  document.getElementById("updated").textContent =
    "마지막 갱신 " + (latest.updated_at || "").replace("T", " ").slice(0, 16);

  document.getElementById("cards").innerHTML = METRICS.map(({ key, label }) => {
    const m = latest.metrics?.[key];
    if (!m) return "";
    const c = m.change;
    const cls = c == null ? "flat" : c > 0 ? "up" : c < 0 ? "down" : "flat";
    const txt = c == null ? "전일 대비 —" : c === 0 ? "보합" : `${c > 0 ? "▲ +" : "▼ "}${fmt(c)}조`;
    return `<div class="card">
      <h2>${label}</h2>
      <div class="value">${fmt(m.value)}<span>조원</span></div>
      <div class="delta ${cls}">${txt}</div>
      <div class="asof">${m.date} 기준</div>
    </div>`;
  }).join("");
}

let chart, history = [];

function draw(days) {
  const rows = history.slice(-days);
  const data = {
    labels: rows.map((r) => r.date.slice(5)),
    datasets: METRICS
      .filter((m) => rows.some((r) => r[m.key] != null))
      .map((m) => ({
        label: m.label,
        data: rows.map((r) => r[m.key] ?? null),
        borderColor: m.color,
        backgroundColor: m.color,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0.25,
        spanGaps: true,
      })),
  };
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
  const line = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();

  if (chart) { chart.data = data; chart.update(); return; }
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: muted, boxWidth: 10, boxHeight: 10, usePointStyle: true } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}조원` } },
      },
      scales: {
        x: { ticks: { color: muted, maxTicksLimit: 7 }, grid: { display: false } },
        y: { ticks: { color: muted, callback: (v) => v + "조" }, grid: { color: line } },
      },
    },
  });
}

async function load() {
  try {
    const bust = "?v=" + Date.now();
    const [latest, hist] = await Promise.all([
      fetch("data/latest.json" + bust).then((r) => r.json()),
      fetch("data/history.json" + bust).then((r) => r.json()),
    ]);
    history = hist;
    renderCards(latest);
    draw(30);
  } catch (e) {
    document.getElementById("cards").innerHTML =
      `<div class="error">아직 수집된 데이터가 없습니다. GitHub Actions에서 워크플로를 한 번 실행해 주세요.</div>`;
  }
}

document.getElementById("ranges").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  [...e.currentTarget.children].forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
  draw(Number(btn.dataset.days));
});

load();
</script>
</body>
</html>
